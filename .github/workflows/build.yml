name: Windows build and tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node.js 24
      - name: Build, test and create self-contained development bundle
        shell: pwsh
        run: ./scripts/Package.ps1 -OutputDirectory .artifacts/ci-package
      - name: Verify installation, upgrade and uninstall
        shell: pwsh
        run: ./scripts/Test-Install.ps1 -BundleDirectory .artifacts/ci-package
      - name: Build isolated design prototype
        shell: pwsh
        working-directory: prototypes/ailearc-ui
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Prototype dependency restore failed.' }
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'Prototype interaction helper tests failed.' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Prototype build failed.' }
      - name: Build self-contained desktop validation host
        shell: pwsh
        run: ./scripts/Build-Desktop.ps1 -SkipRestore
      - name: Build and test pure WPF validation host
        shell: pwsh
        run: ./scripts/Build-WpfValidation.ps1 -Test
      - name: Verify default Debug build and both client languages
        shell: pwsh
        run: ./scripts/Build.ps1
  native-validation:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Build Native SDK validation prototype and read-only backend
        shell: pwsh
        run: ./scripts/Build-NativeValidation.ps1
